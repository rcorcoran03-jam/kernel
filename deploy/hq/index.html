<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kernel HQ</title>
<link rel="icon" type="image/png" href="/assets/kernel-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@300;400;500&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7F1E8;--paper:#FDF9F3;--maroon:#9B2C2C;--maroon2:#7E2424;--ink:#3A2A22;--ink2:#7a6355;--terra:#C97B5A;--sage:#7D8F78;--rule:rgba(58,42,34,.12);--g:#2F3F36;--brass:#D2AA5A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.m{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
h1,h2,h3{font-family:'Bitter',serif;font-weight:400;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(253,249,243,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--maroon)}
.brand img{height:26px;display:block}
.brand b{font-family:'DM Mono',monospace;font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--maroon);border:1px solid rgba(155,44,44,.4);border-radius:4px;padding:2px 6px}
.search{flex:1 1 220px;max-width:360px;padding:8px 12px;border:1px solid var(--rule);border-radius:100px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:100px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 13px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--maroon);color:#fff}
.btn{border:1px solid var(--maroon);background:var(--maroon);color:#fff;border-radius:100px;padding:8px 15px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--maroon2)}
.btn.q{background:transparent;color:var(--maroon);border-color:rgba(155,44,44,.4)}
.btn.q:hover{background:rgba(155,44,44,.06)}
.btn:disabled{opacity:.55;cursor:wait}
.who{margin-left:auto;color:var(--ink2);font-size:12px}
.who a{color:var(--maroon)}
.gate .btn{display:inline-block;margin-top:10px;text-decoration:none}
/* today */
.today{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--rule);background:var(--paper)}
.today .m{color:var(--maroon)}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);background:#fff;border-radius:100px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.pill.late{border-color:rgba(155,44,44,.5);color:var(--maroon)}
.muted{color:var(--ink2)}
/* board */
main{padding:16px 20px 40px}
.stack-board{display:grid;gap:14px}
.grp{display:grid;gap:8px}
.grp-h{display:flex;align-items:center;gap:8px;padding-left:2px}
.grp-h .m{color:var(--lc);font-weight:500}
.gn{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink2);background:rgba(58,42,34,.06);border-radius:100px;padding:1px 8px}
.lane{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--lc);border-radius:12px;box-shadow:0 1px 2px rgba(58,42,34,.04)}
.lane.none{background:rgba(255,255,255,.55);box-shadow:none}
.lane.drop{outline:2px dashed var(--lc);outline-offset:2px}
.lane-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 14px;cursor:pointer;text-align:left}
.lane.none .lane-h{cursor:default;padding:8px 14px}
.lt{font-family:'Bitter',serif;font-size:15px;color:var(--ink)}
.lane.none .lt{color:var(--ink2);font-size:14px}
.lc{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink2)}
.empties{display:flex;flex-wrap:wrap;gap:6px}
.ech{display:inline-flex;align-items:center;gap:2px;border:1px dashed rgba(58,42,34,.2);border-radius:100px;padding:4px 12px;font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.5)}
.ech .lc{margin-left:6px}
.ech.drop{border-style:solid;border-color:var(--lc);background:#fff;color:var(--ink)}
.chev{margin-left:auto;font-size:12px;color:var(--ink2)}
.lane-h:hover .chev{color:var(--maroon)}
.lane .card{background:var(--paper)}
.lane .card:hover{border-color:rgba(58,42,34,.25)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;padding:0 12px 12px}
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:rgba(155,44,44,.35)}
.card .t{font-family:'Bitter',serif;font-size:14.5px;line-height:1.25}
.card .s{font-size:12px;color:var(--ink2);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-family:'DM Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;border-radius:3px;padding:2px 5px;background:var(--cream);color:var(--ink2)}
.tag.scan,.tag.src-lab{background:#E3E9DA;color:#2F3F36}.tag.src-suite{background:#F4E1DE;color:#7E2424}.tag.src-general{background:#EFEAE3;color:#5B4638}.tag.review{background:#F3E3BF;color:#5E4518}.tag.sentb{background:#DCE3EC;color:#24384F}.tag.late{background:#F6DCD6;color:var(--maroon)}
/* list */
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
th{text-align:left;font-family:'DM Mono',monospace;font-weight:400;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--rule);background:var(--paper);cursor:pointer;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.r{cursor:pointer}tr.r:hover td{background:rgba(201,123,90,.06)}
.empty{padding:40px;text-align:center;color:var(--ink2)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(42,29,23,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);z-index:41;overflow-y:auto;box-shadow:-20px 0 50px -30px rgba(0,0,0,.5)}
.dh{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--rule);padding:14px 18px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dh h2{font-size:21px;line-height:1.2}
.dh .x{margin-left:auto;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink2);line-height:1}
.ds{padding:14px 18px;border-bottom:1px solid var(--rule)}
.ds h3{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink2)}
label.f input,label.f select,label.f textarea,.ta{border:1px solid var(--rule);border-radius:7px;padding:7px 9px;background:#fff;font-size:13.5px;color:var(--ink)}
.ta{width:100%;min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:13px}
.kv dt{color:var(--ink2);font-size:11px;padding-top:1px}.kv dd{margin:0;white-space:pre-wrap}
.brief-box{background:#fff;border:1px solid var(--rule);border-left:3px solid var(--g);border-radius:8px;padding:10px 12px}
.brief-box ul{margin:6px 0 0;padding-left:18px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
.tl li.ai{border-left:3px solid var(--brass)}.tl li.stage,.tl li.system{background:transparent;border-style:dashed}.tl li.email{border-left:3px solid #24384F}
.tl .meta{font-size:11px;color:var(--ink2);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.tl .body{white-space:pre-wrap;font-size:13px}
.copy{border:0;background:transparent;color:var(--maroon);cursor:pointer;font-size:11px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:100px;padding:9px 16px;font-size:13px;z-index:60}
.gate{max-width:520px;margin:60px auto;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:26px}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--paper);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(42,29,23,.35)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:10px}
/* dashboard */
.dash{margin-bottom:22px}
.dash-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dash-h h2{font-size:20px}
.btn.sm{padding:5px 12px;font-size:12px}
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr 1.1fr;gap:12px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(58,42,34,.04),0 6px 18px rgba(58,42,34,.04);display:flex;flex-direction:column;gap:6px;min-width:0}
.kt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kl{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .v{font-family:'Bitter',serif;font-size:34px;line-height:1.05;color:var(--ink);letter-spacing:-.01em}
.kpi .s{color:var(--ink2);font-size:12px}
.pillx{font-size:11.5px;font-weight:500;border-radius:100px;padding:2px 8px;white-space:nowrap}
.pillx.up{background:#E3F1E8;color:#256B45}.pillx.up::before{content:"\2191 "}
.pillx.down{background:#F8E1DC;color:#9B2C2C}.pillx.down::before{content:"\2193 "}
.pillx.flat{background:#EFEAE3;color:var(--ink2)}
.stack{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:4px;background:rgba(58,42,34,.06)}
.stack span{display:block;cursor:pointer;min-width:6px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px}
.lgi{border:0;background:none;padding:0;font-size:12px;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.lgi:hover{color:var(--ink)}
.lgi i,.cdot{display:inline-block;width:8px;height:8px;border-radius:50%}
.cdot{margin-right:7px;vertical-align:1px}
.spark{width:100%;height:36px;display:block;margin-top:auto}
.spark .sl{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .sa{fill:rgba(58,42,34,.06)}
.meter{height:8px;border-radius:4px;background:rgba(58,42,34,.06);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;border-radius:4px}
.need{display:grid;gap:2px;margin-top:2px}
.nr{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:5px 8px;margin:0 -8px;border-radius:8px;font-size:12.5px;color:var(--ink2);cursor:pointer;text-align:left}
.nr b{font-weight:500;color:var(--ink2)}
.nr.has b{color:var(--maroon)}
.nr:hover:not(:disabled),.nr.on{background:rgba(155,44,44,.07)}
.nr:disabled{cursor:default;opacity:.7}
.list-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.list-h h2{font-size:20px}
.chip{border:1.5px solid var(--maroon);background:#fff;border-radius:100px;padding:4px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.skc{cursor:pointer;outline:none}
.skhit{fill:transparent}
.skc:hover .skhit,.skc:focus-visible .skhit{fill:rgba(58,42,34,.035)}
.skc.on .skhit{fill:rgba(58,42,34,.06)}
.panel{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(58,42,34,.04),0 6px 18px rgba(58,42,34,.04)}
.panel h3{font-size:16px;margin-bottom:4px}
.panel .cap{font-size:12px;margin:0 0 8px}
.sk-scroll{overflow-x:auto}
.sankey{width:100%;min-width:660px;display:block}
.sankey .flow:hover{opacity:.75}
.sankey .drop{fill:rgba(122,99,85,.22)}
.sankey .drop:hover{fill:rgba(122,99,85,.38)}
.sankey .nl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;fill:var(--ink2)}
.sankey .nv{font-family:'Bitter',serif;font-size:24px;fill:var(--ink)}
.sankey .ns,.sankey .dl{font-size:12px;fill:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .panel{margin-bottom:0}
.wk{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:150px;margin-top:8px;border-bottom:1px solid var(--rule);padding-bottom:0}
.wc{display:flex;flex-direction:column;cursor:default}
.wp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-top:16px}
.wb{display:block;width:70%;max-width:34px;background:#5B4638;border-radius:4px 4px 0 0;min-height:3px}
.wc:hover .wb{background:var(--ink)}
.wv{font-size:11px;color:var(--ink);margin-bottom:2px}
.wx{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.06em;color:var(--ink2);text-align:center;height:0;overflow:visible;white-space:nowrap;transform:translateY(6px)}
.two .panel:first-child{padding-bottom:28px}
.hbars{display:grid;gap:8px;margin-top:8px}
.hb{display:grid;grid-template-columns:104px 1fr 88px;gap:10px;align-items:center;font-size:13px;border:0;background:none;padding:4px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;text-align:left;width:calc(100% + 16px)}
.hb:hover,.hb.on{background:rgba(58,42,34,.05)}
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0 12px}
.line{border:1px solid var(--rule);border-top:3px solid var(--lc);background:#fff;border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;gap:1px}
.line:hover,.line.on{background:rgba(58,42,34,.04)}
.line.on{box-shadow:0 0 0 1.5px var(--lc) inset}
.ln{font-size:12px;color:var(--ink2);font-weight:500}
.lv{font-family:'Bitter',serif;font-size:22px;line-height:1.1}
.lw{font-size:11.5px;color:var(--ink2)}
.hl{color:var(--ink)}
.ht{height:10px;background:rgba(58,42,34,.06);border-radius:0 4px 4px 0}
.hf{display:block;height:100%;border-radius:0 4px 4px 0;min-width:4px}
.hv{color:var(--ink2);font-size:12px;white-space:nowrap;text-align:right}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.kpis{grid-template-columns:1fr}.two{grid-template-columns:1fr}.kpi .v{font-size:24px}}
/* proposal */
.pz-card{margin:0 0 12px}
.pz-ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pz-ch .pz-h{margin:0}
.sc-strip{border:1px solid var(--rule);border-radius:12px;background:var(--cream);padding:10px}
.sc-strip.ex{background:repeating-linear-gradient(135deg,var(--cream),var(--cream) 10px,#F3EADC 10px,#F3EADC 11px)}
.sc-note{font-size:11.5px;color:var(--ink2);margin:0 0 8px}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-t{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sc-t .v{font-family:'Bitter',serif;font-size:24px;line-height:1.1}
.sc-t .s{font-size:11.5px;color:var(--ink2)}
.sc-t .kt .pz-chip{font-size:10.5px}
.trend{width:100%;height:auto;display:block;margin-top:4px}
.trend .tr{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.trend .tg{stroke:#256B45;stroke-width:1.5;stroke-dasharray:4 3}
.trend .hf2{stroke:#A8780A;stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.trend .tl,.trend .tx{font-size:9.5px;fill:var(--ink2);font-family:'DM Mono',monospace}
.sc-sum{margin-top:8px;font-size:13px;color:var(--ink2);text-align:right}
.sc-sum b{color:var(--ink);font-weight:500}
@media (max-width:700px){.sc-grid{grid-template-columns:1fr}}

.tag.prop{background:#F3E7CC;color:#6B4E12}
.pz-sum{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:10px 12px;margin-bottom:12px}
.pz-rows{display:grid;gap:3px}
.pz-r{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.pz-r.b{color:var(--ink);font-weight:500;border-top:1px solid var(--rule);padding-top:4px;margin-top:2px}
.pz-sc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pz-c{background:#fff;border:1px solid var(--rule);border-radius:8px;padding:7px 9px;display:grid;gap:2px}
.pz-c .m{font-size:9px;color:var(--ink2)}
.pz-c b{font-family:'Bitter',serif;font-weight:400;font-size:18px}
.pz-c.now{border-color:#C49412;box-shadow:0 0 0 1px #C49412 inset}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.pz-rv{font-size:12px;margin:6px 0 4px}
.pz-h{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:12px 0 6px}
.pz-t{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.pz-l{width:100%;border:0;border-bottom:1px solid transparent;font-family:'Bitter',serif;font-size:14px;padding:2px 0 4px;background:none;color:var(--ink)}
.pz-l:focus{outline:none;border-bottom-color:var(--rule)}
.pz-g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px 8px;margin-top:6px}
.pz-g.d{grid-template-columns:1fr 1fr;align-items:end}
.pz-g.d .chk{margin:0 0 9px}
.pz-g label.f input{padding:6px 7px;font-size:13px;width:100%}
.pz-f{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:8px}
.pz-rule{font-size:12px;color:var(--ink2);margin:0}
.pz-chip{font-size:11.5px;border-radius:100px;padding:2px 9px;white-space:nowrap}
.pz-chip.met{background:#E3F1E8;color:#256B45}.pz-chip.half{background:#F3E7CC;color:#6B4E12}.pz-chip.miss{background:#F8E1DC;color:#9B2C2C}.pz-chip.open{background:#EFEAE3;color:var(--ink2)}
.pz-src{font-size:11px;color:var(--ink2);margin:4px 0 0}
@media (max-width:700px){.pz-g{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.who{flex-basis:100%;font-size:12px}.top-in{padding:10px 12px}main{padding:12px}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/hq/"><img src="/assets/kernel-wordmark-maroon.svg" alt="kernel"><b>HQ</b></a>
    <label class="sr" for="q">Search leads</label><input id="q" class="search" type="search" placeholder="Search name, business, email">
    <div class="seg" role="group" aria-label="View"><button type="button" id="v-board" aria-pressed="true">Board</button><button type="button" id="v-list" aria-pressed="false">List</button></div>
    <button type="button" class="btn" id="add">+ Add lead</button>
    <button type="button" class="btn q" id="csv">Export CSV</button>
    <span class="who" id="who" hidden><span id="who-e"></span> &middot; <a href="/cdn-cgi/access/logout">Sign out</a></span>
  </div>
  <div class="today" id="today" hidden></div>
</header>
<main id="main"><p class="empty">Loading&hellip;</p></main>

<dialog id="dlg-add" aria-labelledby="add-t">
  <form method="dialog" id="add-form">
    <h2 id="add-t">Add a lead</h2>
    <div class="grid2">
      <label class="f">Name<input name="name" required></label>
      <label class="f">Email<input name="email" type="email"></label>

      var stSel = el("select"); [["draft", "Draft"], ["sent", "Sent"], ["accepted", "Accepted"], ["reviewed", "Reviewed and paid"]].forEach(function (o) { var op = el("option", null, o[1]); op.value = o[0]; if (P.status === o[0]) op.selected = true; stSel.appendChild(op); });
      stSel.addEventListener("change", function () { P.status = stSel.value; });
      g.appendChild(field("Status", stSel));
      var ho = input("handoff", P.handoff, "date"); ho.addEventListener("input", function () { P.handoff = ho.value; paintReview(); }); g.appendChild(field("Lab hand-off date", ho));
      var di = input("disc", P.discovery, "number"); di.addEventListener("input", function () { P.discovery = Number(di.value) || 0; paintSum(); }); g.appendChild(field("Discovery fee ($)", di));
      var li = input("lab", P.lab, "number"); li.addEventListener("input", function () { P.lab = Number(li.value) || 0; paintSum(); }); g.appendChild(field("Lab fee ($)", li));
      sec.appendChild(g);
      var cr = el("label", "chk"); var cb = el("input"); cb.type = "checkbox"; cb.checked = P.credit; cb.addEventListener("change", function () { P.credit = cb.checked; paintSum(); }); cr.appendChild(cb); cr.appendChild(document.createTextNode(" Credit Discovery toward Lab (they sign on within 30 days)")); sec.appendChild(cr);
      var rv = el("p", "muted pz-rv"); sec.appendChild(rv);
      function paintReview() { var d = P.handoff ? new Date(P.handoff + "T12:00:00") : null; if (d) d.setDate(d.getDate() + P.reviewDays); rv.textContent = "Targets are tracked monthly for three months after hand-off and scored at month 3" + (d ? ", around " + d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) + "." : ". Add the hand-off date to set the review date."); }
      paintReview();
      // targets
      sec.appendChild(el("div", "pz-h", "Teach one targets"));
      P.targets.forEach(function (t, i) {
        var box = el("div", "pz-t");
        var lab = input("tl" + i, t.label); lab.className = "pz-l"; lab.addEventListener("input", function () { t.label = lab.value; }); box.appendChild(lab);
        var chip = el("span", "pz-chip"); var rule = el("p", "pz-rule");
        function paint() { var s = score(t), lv = LEVEL[s.level]; chip.className = "pz-chip " + lv[1]; chip.textContent = lv[0] + (s.pay ? " · " + usd(s.pay) : ""); rule.textContent = ruleText(t); paintSum(); }
        if (t.kind === "done") {
          var row = el("div", "pz-g d");
          var dn = el("label", "chk"); var dc = el("input"); dc.type = "checkbox"; dc.checked = t.done; dc.addEventListener("change", function () { t.done = dc.checked; paint(); }); dn.appendChild(dc); dn.appendChild(document.createTextNode(" Done"));
          row.appendChild(dn);
          var am = input("ta" + i, t.amount, "number"); am.addEventListener("input", function () { t.amount = Number(am.value) || 0; paint(); }); row.appendChild(field("Bonus ($)", am));
          box.appendChild(row);
        } else {
          var row2 = el("div", "pz-g");
          if (!t.months) t.months = [null, null, null];
          if (t.actual != null && t.months[2] == null) t.months[2] = t.actual;
          [["baseline", "Baseline"], ["target", "Target"]].forEach(function (k) {
            var ii = input("t" + k[0] + i, t[k[0]], "number"); ii.step = "any"; ii.placeholder = t.unit || "";
            ii.addEventListener("input", function () { t[k[0]] = nnum(ii.value); paint(); }); row2.appendChild(field(k[1] + (t.unit ? " (" + t.unit + ")" : ""), ii));
          });
          [0, 1, 2].forEach(function (m) {
            var ii = input("tm" + m + i, t.months[m], "number"); ii.step = "any"; ii.placeholder = "–";
            ii.addEventListener("input", function () { t.months[m] = nnum(ii.value); t.actual = null; paint(); }); row2.appendChild(field("Month " + (m + 1) + (m === 2 ? " (review)" : ""), ii));
          });
          var am2 = input("ta" + i, t.amount, "number"); am2.addEventListener("input", function () { t.amount = Number(am2.value) || 0; paint(); }); row2.appendChild(field("Bonus ($)", am2));
          box.appendChild(row2);
        }
        var foot = el("div", "pz-f"); foot.appendChild(rule); foot.appendChild(chip); box.appendChild(foot);
        if (t.source) box.appendChild(el("p", "pz-src", "Measured from: " + t.source));
        sec.appendChild(box); paint();
      });
      var r = el("div", "row"); r.style.marginTop = "10px";
      var sv = el("button", "btn", "Save proposal"); sv.type = "button";
      sv.addEventListener("click", function () { sv.disabled = true; api("POST", { action: "update", id: L.id, fields: { proposal: P } }).then(function (res) { sv.disabled = false; if (res.status === "ok") { toast("Proposal saved"); refresh(L.id); } else toast(res.message || "Not saved."); }); });
      r.appendChild(sv); sec.appendChild(r);
      paintSum();
    }
  }

  function drawer(d) {
    closeDrawer();
    var L = d.lead;
    var scrim = el("div", "scrim"); scrim.addEventListener("click", closeDrawer); document.body.appendChild(scrim);
    var dr = el("aside", "drawer"); dr.setAttribute("role", "dialog"); dr.setAttribute("aria-label", "Lead: " + (L.business || L.name));
    var h = el("div", "dh"), hl = el("div");
    hl.appendChild(el("h2", null, L.business || L.name || "Lead"));
    hl.appendChild(el("div", "muted", [L.name, L.email, SRC[L.source] || L.source, (L.tags || []).length ? "also " + L.tags.join(", ") : "", "added " + ago(L.createdAt)].filter(Boolean).join(" · ")));
    h.appendChild(hl);
    var x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "Close"); x.addEventListener("click", closeDrawer); h.appendChild(x);
    dr.appendChild(h);

    // stage + next step
    var s1 = section(dr, "Stage and next step");
    var g = el("div", "grid2");
    var st = el("select"); st.name = "stage"; S.stages.forEach(function (s) { var o = el("option", null, s[1]); o.value = s[0]; if (s[0] === L.stage) o.selected = true; st.appendChild(o); });
    g.appendChild(field("Stage", st));
    var dueI = input("due", L.nextStep.due, "date"); g.appendChild(field("Due", dueI));
    s1.appendChild(g);
    var nx = input("next", L.nextStep.text); nx.placeholder = "e.g. Book the follow-up call"; s1.appendChild(field("Next step", nx));
    var sv = el("button", "btn", "Save"); sv.type = "button"; sv.style.marginTop = "8px"; s1.appendChild(sv);
    sv.addEventListener("click", function () { save({ stage: st.value, nextStep: { text: nx.value, due: dueI.value } }, sv); });

    proposalSection(dr, L);

    // brief
    if (d.brief) {
      var s2 = section(dr, "Opportunity brief");
      var bx = el("div", "brief-box");
      bx.appendChild(el("div", null, d.brief.brief.opportunities.length + " opportunities · " + (d.brief.status === "sent" ? "sent " + (d.brief.sentAt || "").slice(0, 10) : "waiting for your review")));
      var ul = el("ul"); d.brief.brief.opportunities.filter(function (o) { return o.top; }).forEach(function (o) { ul.appendChild(el("li", null, o.title)); }); bx.appendChild(ul);
      var r = el("div", "row"); r.style.marginTop = "8px";
      var a = el("a", "btn q", "Open full brief"); a.href = "/brief.html?id=" + L.briefId + "&t=" + d.brief.approveToken; a.target = "_blank"; a.rel = "noopener"; r.appendChild(a);
      if (d.brief.status !== "sent" && L.email) {
        var send = el("button", "btn", "Send brief to " + L.email); send.type = "button"; r.appendChild(send);
        send.addEventListener("click", function () {
          if (!confirm("Send the brief to " + L.email + "?")) return;
          send.disabled = true; send.textContent = "Sending…";
          api("POST", { action: "send-brief", id: L.id }).then(function (res) { if (res.status === "ok") { toast("Brief sent"); refresh(L.id); } else { send.disabled = false; send.textContent = "Send brief to " + L.email; toast(res.message || "Not sent."); } });
        });
      }
      bx.appendChild(r); s2.appendChild(bx);
    }

    // AI
    var s3 = section(dr, "Claude assist");
    var ar = el("div", "row");
    var prep = el("button", "btn q", "Prep my call"); prep.type = "button";
    var fu = el("button", "btn q", "Draft follow-up"); fu.type = "button";
    var guide = input("guide", ""); guide.placeholder = "Optional guidance for the email"; guide.style.flex = "1 1 200px"; guide.className = "ta"; guide.style.minHeight = "0";
    ar.appendChild(prep); ar.appendChild(fu); ar.appendChild(guide); s3.appendChild(ar);
    s3.appendChild(el("p", "muted", "Uses the lead, brief, and recent notes. Results are saved to the timeline; nothing is sent."));
    function ai(task, btn) {
      var t0 = btn.textContent; btn.disabled = true; btn.textContent = "Thinking…";
      api("POST", { action: "ai", id: L.id, task: task, prompt: guide.value }).then(function (res) { btn.disabled = false; btn.textContent = t0; if (res.status === "ok") { toast(task === "prep" ? "Call prep added" : "Draft added"); refresh(L.id); } else toast(res.message || "Claude didn't respond."); });
    }
    prep.addEventListener("click", function () { ai("prep", prep); });
    fu.addEventListener("click", function () { ai("followup", fu); });

    // what they told us
    var told = [["More room for", L.room], ["Keeps slipping", L.stuck], ["How it runs", L.operations], ["Admires", L.admire], ["Tools", L.tools], ["Team", L.team], ["Location", L.location], ["Message", L.message], ["Interested in", (L.interested || []).join("\n")]].filter(function (r) { return r[1]; });
    if (told.length) { var s4 = section(dr, "What they told us"); var dl = el("dl", "kv"); told.forEach(function (r) { dl.appendChild(el("dt", null, r[0])); dl.appendChild(el("dd", null, r[1])); }); s4.appendChild(dl); }

    // notes
    var s5 = section(dr, "Timeline");
    var ta = el("textarea", "ta"); ta.placeholder = "Add a note: a call, an email, a decision"; s5.appendChild(ta);
    var nr = el("div", "row"); nr.style.margin = "6px 0 12px";
    var addN = el("button", "btn", "Add note"); addN.type = "button";
    var addE = el("button", "btn q", "Log as email"); addE.type = "button";
    nr.appendChild(addN); nr.appendChild(addE); s5.appendChild(nr);
    function note(kind, btn) { if (!ta.value.trim()) { ta.focus(); return; } btn.disabled = true; api("POST", { action: "note", id: L.id, text: ta.value, kind: kind }).then(function (res) { btn.disabled = false; if (res.status === "ok") refresh(L.id); else toast(res.message || "Not saved."); }); }
    addN.addEventListener("click", function () { note("note", addN); });
    addE.addEventListener("click", function () { note("email", addE); });
    var tl = el("ul", "tl");
    L.notes.slice().reverse().forEach(function (n) {
      var li = el("li", n.kind); var mt = el("div", "meta");
      mt.appendChild(el("span", null, new Date(n.at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + (n.by ? " · " + n.by : "") + (n.kind !== "note" ? " · " + n.kind : "")));
      if (n.kind === "ai") { var cp = el("button", "copy", "Copy"); cp.type = "button"; cp.addEventListener("click", function () { navigator.clipboard.writeText(n.text.replace(/^(Draft follow-up|Call prep):\n/, "")).then(function () { toast("Copied"); }); }); mt.appendChild(cp); }
      li.appendChild(mt); li.appendChild(el("div", "body", n.text)); tl.appendChild(li);
    });
    s5.appendChild(tl);

    // contact
    var s6 = section(dr, "Contact details");
    var g2 = el("div", "grid2"), inputs = {};
    [["name", "Name"], ["email", "Email"], ["business", "Business"], ["website", "Website"], ["phone", "Phone"], ["location", "Location"]].forEach(function (f) { inputs[f[0]] = input(f[0], L[f[0]]); g2.appendChild(field(f[1], inputs[f[0]])); });
    s6.appendChild(g2);
    var sv2 = el("button", "btn q", "Save details"); sv2.type = "button"; sv2.style.marginTop = "8px"; s6.appendChild(sv2);
    sv2.addEventListener("click", function () { var f = {}; Object.keys(inputs).forEach(function (k) { f[k] = inputs[k].value; }); save(f, sv2); });

    document.body.appendChild(dr); x.focus(); document.addEventListener("keydown", esc);
    function save(fields, btn) {
      btn.disabled = true;
      api("POST", { action: "update", id: L.id, fields: fields }).then(function (res) { btn.disabled = false; if (res.status === "ok") { toast("Saved"); refresh(L.id); } else toast(res.message || "Not saved."); });
    }
  }
  function refresh(id) { load().then(function () { openLead(id); }); }

  /* ---------- add, export, search, view ---------- */
  var dlg = $("#dlg-add");
  $("#add").addEventListener("click", function () { $("#add-form").reset(); dlg.showModal(); });
  $("#add-cancel").addEventListener("click", function () { dlg.close(); });
  $("#add-form").addEventListener("submit", function (e) {
    e.preventDefault(); var f = new FormData(e.target), lead = {}; f.forEach(function (v, k) { lead[k] = v; });
    if (!lead.name) return;
    api("POST", { action: "create", lead: lead }).then(function (d) { if (d.status === "ok") { dlg.close(); toast("Lead added"); load().then(function () { openLead(d.lead.id); }); } else toast(d.message || "Not added."); });
  });
  $("#csv").addEventListener("click", function () {
    var rows = [["Business", "Name", "Email", "Stage", "Source", "Next step", "Due", "Updated"]];
    S.leads.forEach(function (l) { rows.push([l.b, l.n, l.e, label(l.s), SRC[l.src] || l.src, l.nx, l.d, l.u]); });
    var csv = rows.map(function (r) { return r.map(function (v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\n");
    var a = el("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "kernel-leads-" + today() + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  });
  $("#q").addEventListener("input", function (e) { S.q = e.target.value; render(); });
  function setView(v) { S.view = v; $("#v-board").setAttribute("aria-pressed", String(v === "board")); $("#v-list").setAttribute("aria-pressed", String(v === "list")); try { localStorage.setItem("hq_view", v); } catch (e) {} render(); }
  $("#v-board").addEventListener("click", function () { setView("board"); });
  $("#v-list").addEventListener("click", function () { setView("list"); });
  try { if (localStorage.getItem("hq_dash") === "0") S.dash = false; } catch (e) {}
  try { if (localStorage.getItem("hq_view") === "list") { S.view = "list"; $("#v-board").setAttribute("aria-pressed", "false"); $("#v-list").setAttribute("aria-pressed", "true"); } } catch (e) {}
  load();
})();
</script>
