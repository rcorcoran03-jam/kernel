<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your Opportunity Brief · Kernel Lab</title>
<link rel="icon" type="image/png" href="assets/kernel-seed.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brief.css?v=20261103">
<style>
body{margin:0;background:#2F3F36;font-family:'DM Sans',sans-serif}
.page{max-width:980px;margin:0 auto;padding:22px 16px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:#C9D1BC;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.bar a{color:#D9B872;text-decoration:none}
.bar button{background:transparent;border:1px solid rgba(210,170,90,.5);color:#EFEADB;border-radius:100px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0;text-transform:none;cursor:pointer}
.msg{background:#FBF8EF;border-radius:12px;padding:28px;color:#23302A;font-size:15px;line-height:1.6}
.preview{background:#F3E3BF;color:#5E4518;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
@media print{body{background:#fff}.bar,.preview{display:none}.page{padding:0;max-width:none}}
</style>
<script src="brief-render.js?v=20261103" defer></script>
</head>
<body>
<main class="page">
  <div class="bar"><a href="/">kernel-collective.com</a><button type="button" id="print">Print or save as PDF</button></div>
  <div id="note"></div>
  <div id="root" class="msg" aria-live="polite">Loading your brief&hellip;</div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var q = new URLSearchParams(location.search), root = document.getElementById("root");
  fetch("/api/brief?id=" + encodeURIComponent(q.get("id") || "") + "&t=" + encodeURIComponent(q.get("t") || ""))
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.status !== "ok") { root.textContent = d.message || "We couldn't find that brief."; return; }
      root.className = "";
      if (d.preview) document.getElementById("note").innerHTML = '<p class="preview">Kernel preview. The founder can&rsquo;t open this link until you send it.</p>';
      var date = d.createdAt ? new Date(d.createdAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "";
      KernelBrief.render(root, d.brief, { input: d.input, date: date ? "Prepared " + date : "", cta: ["Book the free follow‑up call", "mailto:hello@kernel-collective.com?subject=" + encodeURIComponent("Follow-up call: " + d.brief.business)] });
      document.title = d.brief.business + " · Opportunity Brief · Kernel Lab";
    })
    .catch(function () { root.textContent = "We couldn't load your brief. Please try the link again in a moment."; });
  document.getElementById("print").addEventListener("click", function () {
    var closed = Array.prototype.slice.call(document.querySelectorAll(".kb-item:not([open])"));
    closed.forEach(function (x) { x.open = true; }); window.print(); closed.forEach(function (x) { x.open = false; });
  });
});
</script>
</body>
</html>
